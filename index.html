<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Carditek Holter Portal — Login</title>
<link rel="icon" href="assets/favicon-32.png" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<main class="center-screen">
  <div class="card auth-card">
    <div class="auth-logo">
      <img src="assets/carditek-logo.png" alt="Carditek" />
      <div class="company">Carditek Holter Portal</div>
    </div>

    <div class="tabs" id="modeTabs">
      <div class="tab active" data-mode="login">Log in</div>
      <div class="tab" data-mode="register">New patient</div>
    </div>

    <!-- ============ LOG IN ============ -->
    <form id="loginForm">
      <div class="tabs" id="loginRoleTabs">
        <div class="tab active" data-role="patient">Patient</div>
        <div class="tab" data-role="admin">Admin</div>
      </div>

      <label id="loginIdLabel" for="loginId">Phone number</label>
      <input id="loginId" inputmode="tel" placeholder="10-digit phone number" required />

      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" required />

      <button class="btn btn-primary btn-block" style="margin-top:18px" type="submit">Log in</button>
      <div class="msg" id="loginMsg"></div>
      <p class="muted" style="text-align:center;margin-top:14px">
        Forgot your password? Call <strong>91106 00616</strong> and admin will reset it for you.
      </p>
    </form>

    <!-- ============ PATIENT REGISTER ============ -->
    <form id="registerForm" style="display:none">
      <label for="regName">Full name</label>
      <input id="regName" required />

      <div class="field-row">
        <div>
          <label for="regAge">Age</label>
          <input id="regAge" type="number" min="0" max="120" />
        </div>
        <div>
          <label for="regSex">Sex</label>
          <select id="regSex">
            <option value="">Select</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <label for="regPhone">Phone number</label>
      <input id="regPhone" inputmode="tel" placeholder="10-digit phone number" required />
      <p class="hint">You'll log in with this number, so double-check it.</p>

      <label for="regEmail">Email (optional)</label>
      <input id="regEmail" type="email" />

      <label for="regPassword">Create a password</label>
      <input id="regPassword" type="password" minlength="6" required />

      <label style="display:flex;align-items:flex-start;gap:8px;font-weight:400;margin-top:16px">
        <input type="checkbox" id="regConsent" style="width:auto;margin-top:3px" required />
        <span class="muted" style="font-size:0.85rem">
          I consent to my Holter monitoring and symptom data being recorded by Carditek for my care.
        </span>
      </label>

      <button class="btn btn-primary btn-block" style="margin-top:18px" type="submit">Create account</button>
      <div class="msg" id="registerMsg"></div>
    </form>
  </div>
</main>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script>
const modeTabs = document.getElementById("modeTabs");
const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");
const loginRoleTabs = document.getElementById("loginRoleTabs");
const loginIdLabel = document.getElementById("loginIdLabel");
const loginId = document.getElementById("loginId");
let loginRole = "patient";

modeTabs.addEventListener("click", (e) => {
  const tab = e.target.closest(".tab");
  if (!tab) return;
  [...modeTabs.children].forEach(t => t.classList.toggle("active", t === tab));
  const mode = tab.dataset.mode;
  loginForm.style.display = mode === "login" ? "block" : "none";
  registerForm.style.display = mode === "register" ? "block" : "none";
});

loginRoleTabs.addEventListener("click", (e) => {
  const tab = e.target.closest(".tab");
  if (!tab) return;
  [...loginRoleTabs.children].forEach(t => t.classList.toggle("active", t === tab));
  loginRole = tab.dataset.role;
  if (loginRole === "admin") {
    loginIdLabel.textContent = "Admin email";
    loginId.type = "email";
    loginId.placeholder = "you@carditek.com";
    loginId.inputMode = "email";
  } else {
    loginIdLabel.textContent = "Phone number";
    loginId.type = "text";
    loginId.placeholder = "10-digit phone number";
    loginId.inputMode = "tel";
  }
});

function digitsOnly(s) { return (s || "").replace(/\D/g, ""); }
function phoneToEmail(phone) { return `${digitsOnly(phone)}@patients.carditek.local`; }

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("loginMsg");
  hideMsg(msg);
  const password = document.getElementById("loginPassword").value;
  const email = loginRole === "admin" ? loginId.value.trim() : phoneToEmail(loginId.value);

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) { showMsg(msg, "Login failed — check your details and try again.", "error"); return; }

  const { data: profile } = await supabaseClient.from("profiles").select("role").eq("id", data.user.id).single();
  if (!profile) { showMsg(msg, "Account not set up correctly. Contact admin.", "error"); return; }
  if (loginRole === "admin" && profile.role !== "admin") { showMsg(msg, "This isn't an admin account.", "error"); await supabaseClient.auth.signOut(); return; }
  if (loginRole === "patient" && profile.role !== "patient") { showMsg(msg, "This isn't a patient account.", "error"); await supabaseClient.auth.signOut(); return; }

  window.location.href = profile.role === "admin" ? "admin.html" : "patient.html";
});

document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("registerMsg");
  hideMsg(msg);

  const full_name = document.getElementById("regName").value.trim();
  const age = document.getElementById("regAge").value || null;
  const sex = document.getElementById("regSex").value || null;
  const phone = document.getElementById("regPhone").value.trim();
  const emailInput = document.getElementById("regEmail").value.trim();
  const password = document.getElementById("regPassword").value;

  if (digitsOnly(phone).length < 10) { showMsg(msg, "Enter a valid 10-digit phone number."); return; }

  const loginEmail = phoneToEmail(phone);
  const { data: signUpData, error: signUpErr } = await supabaseClient.auth.signUp({
    email: loginEmail,
    password,
    options: { data: { role: "patient" } },
  });
  if (signUpErr) { showMsg(msg, signUpErr.message.includes("registered") ? "This phone number is already registered." : "Could not create account."); return; }

  // If email confirmation is enabled in Supabase, there's no session yet — sign in explicitly.
  let session = signUpData.session;
  if (!session) {
    const { data: signInData, error: signInErr } = await supabaseClient.auth.signInWithPassword({ email: loginEmail, password });
    if (signInErr) { showMsg(msg, "Account created — please log in.", "success"); return; }
    session = signInData.session;
  }

  const { error: insertErr } = await supabaseClient.from("patients").insert({
    id: session.user.id,
    full_name, age, sex, phone,
    email: emailInput || null,
    consent_given: true,
    consent_date: new Date().toISOString(),
  });
  if (insertErr) { showMsg(msg, "Account created, but saving your details failed. Contact admin."); return; }

  window.location.href = "patient.html";
});
</script>
<script src="js/common.js"></script>
</body>
</html>
